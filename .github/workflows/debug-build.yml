name: Debug APK

on:
  workflow_dispatch:         # run manually from the Actions tab
  push:                       # run on pushes to main
    branches:
      - main
      - 'hotfix/**'           # optional: build feature / hot-fix branches too

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out your code
      - uses: actions/checkout@v4

      # 2. JDK for Gradle
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17
          cache: gradle        # speeds up repeat builds

      # 3. Android SDK cmdline-tools
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 4. Inject Gemini API key from secret into local.properties
      - name: Inject Gemini API key
        shell: bash
        run: |
          echo "ApiKey=${{ secrets.GEMINI_API_KEY }}" >> local.properties

      # 5. Build the debug APK
      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon

      # 6. Expose the artifact for download
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
